<city-stars-page
  title="Adhésion — City Stars BC"
  lang="fr"
  doctype="html"
  body-class="d-flex flex-column"
  header="shared"
  footer="shared"
>
  <page-content>
    <main class="flex-shrink-0">
      <section class="py-5">
        <div class="container px-5 my-5">
          <div class="row gx-5 justify-content-center">
            <div class="col-lg-8">
              <div class="text-center mb-5">
                <div class="feature bg-primary bg-gradient text-white rounded-3 mb-3">
                  <i class="bi bi-person-plus" aria-hidden="true"></i>
                </div>
                <h1 class="fw-bolder">Rejoignez City Stars BC</h1>
                <p class="lead fw-normal text-muted mb-0">
                  Remplissez ce formulaire pour finaliser votre adhésion au club.
                </p>
              </div>

              <form id="inscriptionForm">
                <h2 class="fw-bold mb-3 fs-5 text-uppercase text-muted border-bottom pb-2">Vos coordonnées</h2>

                <div class="row gx-3">
                  <div class="col-md-6 mb-3">
                    <div class="form-floating">
                      <input
                        class="form-control"
                        id="prenom"
                        type="text"
                        placeholder="Votre prénom"
                        autocomplete="given-name"
                      />
                      <label for="prenom">Prénom</label>
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <div class="form-floating">
                      <input
                        class="form-control"
                        id="nom"
                        type="text"
                        placeholder="Votre nom"
                        autocomplete="family-name"
                      />
                      <label for="nom">Nom</label>
                    </div>
                  </div>
                </div>
                <div class="form-floating mb-3">
                  <input
                    class="form-control"
                    id="courriel"
                    type="email"
                    placeholder="votre@email.fr"
                    autocomplete="email"
                  />
                  <label for="courriel">Courriel</label>
                </div>

                <div class="form-floating mb-4">
                  <input
                    class="form-control"
                    id="telephone-inscription"
                    type="tel"
                    placeholder=" "
                    autocomplete="tel"
                  />
                  <label for="telephone-inscription">Téléphone</label>
                </div>
                <fieldset class="mb-4">
                  <legend class="fw-bold mb-3 fs-5 text-uppercase text-muted border-bottom pb-2 w-100">Niveau de pratique</legend>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="niveau" id="niveau-debutant" value="debutant" />
                    <label class="form-check-label" for="niveau-debutant"
                      >Débutant — je n'ai jamais pratiqué le basket en club</label
                    >
                  </div>
                  <div class="form-check mb-2">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="niveau"
                      id="niveau-intermediaire"
                      value="intermediaire"
                    />
                    <label class="form-check-label" for="niveau-intermediaire"
                      >Intermédiaire — j'ai déjà pratiqué occasionnellement</label
                    >
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="niveau" id="niveau-confirme" value="confirme" />
                    <label class="form-check-label" for="niveau-confirme"
                      >Confirmé — je pratique régulièrement depuis plusieurs années</label
                    >
                  </div>
                </fieldset>
                <fieldset class="mb-4">
                  <legend class="fw-bold mb-3 fs-5 text-uppercase text-muted border-bottom pb-2 w-100">Disponibilités</legend>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="dispo" id="dispo-mardi" value="mardi" />
                    <label class="form-check-label" for="dispo-mardi">Mardi soir — 19h à 21h</label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="dispo" id="dispo-samedi" value="samedi" />
                    <label class="form-check-label" for="dispo-samedi">Samedi matin — 10h à 12h</label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="dispo" id="dispo-mercredi" value="mercredi" />
                    <label class="form-check-label" for="dispo-mercredi"
                      >Mercredi matin — 10h à 11h30 (section jeunes U14)</label
                    >
                  </div>
                </fieldset>
                <fieldset class="mb-5">
                  <legend class="fw-bold mb-3 fs-5 text-uppercase text-muted border-bottom pb-2 w-100">
                    Faites votre choix
                  </legend>
                  <div class="form-check mb-2">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="formule"
                      id="formule-decouverte"
                      value="decouverte"
                    />
                    <label class="form-check-label" for="formule-decouverte">
                      <strong>Découverte</strong> — Gratuit · 1 séance d'essai
                    </label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="formule" id="formule-loisir" value="loisir" />
                    <label class="form-check-label" for="formule-loisir">
                      <strong>Loisir</strong> — 180 €/an · Entraînements illimités + matchs amicaux
                    </label>
                  </div>
                  <div class="form-check mb-2">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="formule"
                      id="formule-competition"
                      value="competition"
                    />
                    <label class="form-check-label" for="formule-competition">
                      <strong>Compétition</strong> — 320 €/an · Tout inclus + licence sportive
                    </label>
                  </div>
                </fieldset>

                <h2 class="fw-bold mb-3 fs-5 text-uppercase text-muted border-bottom pb-2">Date de naissance</h2>
                <div class="mb-4">
                  <p class="text-muted small mb-2">
                    Utilisez le sélecteur ci-dessous pour indiquer votre date de naissance.
                  </p>
                  <div class="form-floating mb-3">
                    <input
                      class="form-control"
                      id="date-naissance"
                      type="date"
                    />
                    <label for="date-naissance">Date de naissance</label>
                  </div>
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">Soumettre ma demande d'adhésion</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
  </page-content>
  <page-scripts>
  </page-scripts>
</city-stars-page>

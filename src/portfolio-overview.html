<city-stars-page
  title="Nos événements — City Stars BC"
  lang="fr"
  doctype="html"
  body-class="d-flex flex-column"
  shell-class="flex-shrink-0"
  header="shared"
  footer="shared"
>
  <page-content>
    <div class="py-5">
      <div class="container px-5 my-5">
        <div class="text-center mb-5">
          <div class="fw-bolder portfolio-heading">Nos événements</div>
          <p class="lead fw-normal text-muted mb-0">Tournois, matchs amicaux et moments de vie du club</p>
        </div>
        <div class="row gx-5">
          <div class="col-lg-6">
            <div class="position-relative mb-5">
              <img
                class="img-fluid rounded-3 mb-3"
                src="https://dummyimage.com/600x400/343a40/6c757d"
                alt="Photo du tournoi régional amateur 2023"
              />
              <a class="h3 fw-bolder text-decoration-none link-dark stretched-link" href="#!"
                >Tournoi régional amateur 2023</a
              >
            </div>
          </div>
          <div class="col-lg-6">
            <div class="position-relative mb-5">
              <img
                class="img-fluid rounded-3 mb-3"
                src="https://dummyimage.com/600x400/343a40/6c757d"
                alt="Photo de la finale féminine 2023"
              />
              <a class="h3 fw-bolder text-decoration-none link-dark stretched-link" href="#!">Finale féminine 2023</a>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="position-relative mb-5 mb-lg-0">
              <img
                class="img-fluid rounded-3 mb-3"
                src="https://dummyimage.com/600x400/343a40/6c757d"
                alt="Photo du tournoi U14 départemental"
              />
              <a class="h3 fw-bolder text-decoration-none link-dark stretched-link" href="#!"
                >Tournoi U14 départemental</a
              >
            </div>
          </div>
          <div class="col-lg-6">
            <div class="position-relative">
              <img
                class="img-fluid rounded-3 mb-3"
                src="https://dummyimage.com/600x400/343a40/6c757d"
                alt="Photo de la journée portes ouvertes du club"
              />
              <a class="h3 fw-bolder text-decoration-none link-dark stretched-link" href="#!"
                >Journée portes ouvertes</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="py-5 bg-light">
      <div class="container px-5 my-5">
        <div class="display-4 fw-bolder mb-4">Participez à nos prochains événements</div>
        <a class="btn btn-lg btn-primary" href="#!">Nous contacter</a>
      </div>
    </div>
  </page-content>
</city-stars-page>

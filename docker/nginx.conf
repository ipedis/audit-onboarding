server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    add_header_inherit merge;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy 'autoplay=(self "https://www.youtube.com"), camera=(), fullscreen=(self "https://www.youtube.com"), geolocation=(), microphone=(), payment=(), usb=()' always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; frame-src https://www.youtube.com; img-src 'self' data: https://dummyimage.com; media-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'" always;

    location = /_infra/healthcheck {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:css|js|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* ^/assets/.+\.(?:avif|gif|ico|jpe?g|mp4|pdf|png|svg|webm|webp)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html =404;
    }
}

name: Deploy staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  IMAGE: rg.fr-par.scw.cloud/pdfa11y/audit-onboarding
  SERVICE: audit-onboarding
  TAG: latest

jobs:
  build-and-deploy:
    name: Publish and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Scaleway registry
        uses: docker/login-action@v4
        with:
          registry: rg.fr-par.scw.cloud/pdfa11y
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger staging deployment
        uses: passeidireto/trigger-external-workflow-action@main
        env:
          PAYLOAD_TAG: ${{ env.TAG }}
          PAYLOAD_IMAGE: ${{ env.IMAGE }}
          PAYLOAD_SERVICE: ${{ env.SERVICE }}
        with:
          repository: docaxess/pdfa11y-k8s-webservices
          event: deploy_staging
          github_pat: ${{ secrets.K8S_WEBSERVICES_PAT }}

      - name: Notify Slack
        id: slack_notification
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.DEPLOYMENT_SLACK_BOT }}
          errors: true
          payload: |
            {
              "text": ":rocket: Audit Onboarding a été déployé en staging : https://staging-audit-onboarding.e-accessibility.info (${{ env.TAG }})"
            }
